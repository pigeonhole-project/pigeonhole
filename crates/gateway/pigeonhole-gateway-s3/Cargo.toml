[package]
name = "pigeonhole-gateway-s3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "S3 gateway (s3s) for pigeonhole"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
md-5 = { workspace = true }
s3s = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pigeonhole-chunk-store = { workspace = true }
pigeonhole-meta = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pigeonhole-testkit = { workspace = true, features = ["s3"] }
postcard = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
pigeonhole-storage-memory = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# The md-5 package is the md5 library: machete reads only the package name.
ignored = ["md-5"]
