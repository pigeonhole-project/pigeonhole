// Commands of the S3 gateway namespace ("s3"). Every change to buckets,
// objects and multipart uploads is one Command applied in one transaction.
// Timestamps and upload ids are chosen by the proposer, never by apply.
syntax = "proto3";

package pigeonhole.s3.v1;

message Command {
  oneof op {
    CreateBucket create_bucket = 1;
    DeleteBucket delete_bucket = 2;
    PutObject put_object = 3;
    DeleteObject delete_object = 4;
    PutObjectTags put_object_tags = 5;
    DeleteObjectTags delete_object_tags = 6;
    CreateUpload create_upload = 7;
    PutPart put_part = 8;
    CompleteUpload complete_upload = 9;
    AbortUpload abort_upload = 10;
  }
}

// Committed result: chunk ids the caller must release (replaced or removed).
message Released {
  repeated int64 chunk_ids = 1;
}

// Deterministic failure of a command (its writes are rolled back).
message Rejection {
  oneof reason {
    bool bucket_exists = 1;
    bool bucket_not_found = 2;
    bool bucket_not_empty = 3;
    bool no_such_key = 4;
    bool no_such_upload = 5;
    int64 missing_part = 6;
  }
}

message Extent {
  int64 chunk = 1;
  int64 offset = 2;
  int64 len = 3;
}

message Pair {
  string name = 1;
  string value = 2;
}

message CreateBucket {
  string name = 1;
  string scope_id = 2;
  string created_at = 3;
}

message DeleteBucket {
  string name = 1;
}

// Insert or replace an object (user metadata and tags of the old version go).
message PutObject {
  string bucket = 1;
  string key = 2;
  string etag = 3;
  int64 size = 4;
  optional string content_type = 5;
  repeated Extent extents = 6;
  repeated Pair user_meta = 7;
  string checksums_json = 8;
  string mtime = 9;
}

message DeleteObject {
  string bucket = 1;
  string key = 2;
}

message PutObjectTags {
  string bucket = 1;
  string key = 2;
  repeated Pair tags = 3;
}

message DeleteObjectTags {
  string bucket = 1;
  string key = 2;
}

message CreateUpload {
  string upload_id = 1;
  string bucket = 2;
  string key = 3;
  optional string content_type = 4;
  repeated Pair user_meta = 5;
  repeated Pair tags = 6;
  optional string checksum_algorithm = 7;
  string initiated_at = 8;
}

message PutPart {
  string upload_id = 1;
  int64 part_number = 2;
  string etag = 3;
  int64 size = 4;
  repeated Extent extents = 5;
}

// Assemble the object from parts; part extents move to the object (no release).
message CompleteUpload {
  string upload_id = 1;
  repeated int64 part_numbers = 2;
  string etag = 3;
  int64 total_size = 4;
  string mtime = 5;
}

message AbortUpload {
  string upload_id = 1;
}
