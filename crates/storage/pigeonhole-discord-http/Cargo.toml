bytes = { workspace = true }
pigeonhole-limits = { workspace = true }
pigeonhole-storage-api = { workspace = true }
pigeonhole-storage-discord = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
dotenvy = { workspace = true }
futures = { workspace = true }
pigeonhole-meta = { workspace = true, features = ["testsuite"] }
pigeonhole-storage-discord = { workspace = true, features = ["fake"] }
pigeonhole-testkit = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
