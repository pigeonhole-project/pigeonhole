grammers-tl-types = { workspace = true }
hex = { workspace = true }
pigeonhole-limits = { workspace = true }
pigeonhole-storage-api = { workspace = true }
pigeonhole-storage-telegram = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
