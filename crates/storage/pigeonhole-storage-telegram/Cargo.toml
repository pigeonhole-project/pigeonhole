[package]
name = "pigeonhole-storage-telegram"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Telegram storage backend for pigeonhole over MTProto, logged in as a bot"

[features]
# The in-memory channel (`fake`): tests, the site's demo and the opt-in
# fake-channel build. Never in a default build (scripts/check_deps.py).
fake = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
lru = { workspace = true }
pigeonhole-limits = { workspace = true }
pigeonhole-storage-api = { workspace = true }
pigeonhole-types = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pigeonhole-storage-telegram = { path = ".", features = ["fake"] }
pigeonhole-meta = { workspace = true, features = ["testsuite"] }
pigeonhole-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
dotenvy = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
