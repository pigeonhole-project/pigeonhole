// The tablet's command log (see docs/meta-backends.md). An Entry is one layer
// command routed by namespace; a Batch is one LogStore write (group commit).
syntax = "proto3";

package pigeonhole.meta.v1;

message Entry {
  string namespace = 1;
  bytes command = 2;
}

// Entries get consecutive positions starting at `first`. An empty batch is the
// zero entry of generation `gen`: it takes no position.
message Batch {
  uint64 gen = 1;
  uint64 first = 2;
  repeated Entry entries = 3;
}
