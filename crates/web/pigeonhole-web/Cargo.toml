[package]
name = "pigeonhole-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "pigeonhole in one process on in-memory stores, for the site's in-browser demo (wasm32-wasip1)"

[lib]
# cdylib: the module the site loads (wasm32-wasip1, exports ph_open / ph_call).
crate-type = ["rlib", "cdylib"]

[dependencies]
pigeonhole-admin = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
openraft-chat = { workspace = true }
openraft-grpc = { workspace = true }
pigeonhole-raft-telegram = { workspace = true }
pigeonhole-blob = { workspace = true }
pigeonhole-config = { workspace = true, features = ["fake"] }
pigeonhole-fake-channels = { workspace = true }
pigeonhole-meta = { workspace = true }
pigeonhole-node = { workspace = true }
pigeonhole-storage-api = { workspace = true, features = ["fake"] }
pigeonhole-storage-discord = { workspace = true, features = ["fake"] }
pigeonhole-storage-memory = { workspace = true }
pigeonhole-storage-telegram = { workspace = true, features = ["fake"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Only their `fake` feature is wanted: the in-memory channels of the demo.
ignored = ["pigeonhole-storage-api", "pigeonhole-storage-discord"]
