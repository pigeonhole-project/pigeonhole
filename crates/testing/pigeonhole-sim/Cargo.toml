[package]
name = "pigeonhole-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic simulation scenarios for pigeonhole (madsim; docs/simulation.md)"
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
pigeonhole-blob = { workspace = true }
pigeonhole-meta = { workspace = true }
pigeonhole-storage-disk = { workspace = true }
pigeonhole-storage-memory = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
pigeonhole-storage-api = { workspace = true, features = ["conformance"] }
openraft-chat = { workspace = true }
pigeonhole-chunk-store = { workspace = true }
pigeonhole-gateway-s3 = { workspace = true }
pigeonhole-testkit = { workspace = true, features = ["s3"] }
s3s = { workspace = true }
# The tests on tokio (`make test`) run on a paused clock: what they wait for
# (a backoff of half an hour) takes no time, as under the simulator.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(madsim)'.dependencies]
madsim = "0.2"

[lints]
workspace = true
