[package]
name = "pigeonhole-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A pigeonhole node assembled from its Config: the tablet, the chunk store, the S3 handlers, the admin and the background loops; the binary and the in-browser build add only their channels"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
metrics = { workspace = true }
openraft = { workspace = true }
openraft-chat = { workspace = true }
openraft-grpc = { workspace = true }
pigeonhole-admin = { workspace = true }
pigeonhole-blob = { workspace = true }
pigeonhole-chunk-store = { workspace = true }
pigeonhole-config = { workspace = true }
pigeonhole-gateway-s3 = { workspace = true }
pigeonhole-meta = { workspace = true }
pigeonhole-storage-api = { workspace = true }
pigeonhole-storage-disk = { workspace = true }
pigeonhole-storage-memory = { workspace = true }
pigeonhole-types = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
