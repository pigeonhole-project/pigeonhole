// Commands of the chunk-store namespace ("chunk"). Every change to chunk
// metadata is one Command, applied all-or-nothing (see docs/meta-backends.md).
// Ids and timestamps are chosen by the proposer, never by apply.
syntax = "proto3";

package pigeonhole.chunk.v1;

message Command {
  oneof op {
    SyncInstances sync_instances = 1;
    CommitChunk commit_chunk = 2;
    Retain retain = 3;
    Release release = 4;
    BeginReclaim begin_reclaim = 7;
    DropChunk drop_chunk = 8;
    AddReplica add_replica = 9;
  }
}

// Deterministic failure of a command (its writes are rolled back).
message Rejection {
  oneof reason {
    // Retain: chunk missing, refs = 0, or reclaiming.
    int64 chunk_gone = 1;
    // Release: refs already 0, chunk missing, or reclaiming.
    int64 double_release = 2;
    // BeginReclaim: chunk is referenced again or already gone.
    int64 not_reclaimable = 3;
  }
}

message Instance {
  string id = 1;
  string kind = 2;
  string fingerprint = 3;
  string location = 4;
  // read-write | read-only | retired
  string state = 5;
}

// Upsert configured instances; instances not listed become retired.
message SyncInstances {
  repeated Instance instances = 1;
}

message Block {
  int64 block_no = 1;
  int64 logical_off = 2;
  int64 logical_len = 3;
  int64 stored_len = 4;
  string codec = 5;
}

message Part {
  uint32 first_block = 1;
  uint32 block_count = 2;
  bytes sort_key = 3;
  bytes locator = 4;
}

message Replica {
  string instance = 1;
  repeated Part parts = 2;
}

// New chunk with refs = 1 after a successful quorum write.
message CommitChunk {
  int64 chunk_id = 1;
  int64 logical_size = 2;
  uint32 crc32 = 3;
  repeated Block blocks = 4;
  repeated Replica replicas = 5;
  string created_at = 6;
}

// All-or-nothing refs + 1.
message Retain {
  repeated int64 chunk_ids = 1;
}

// All-or-nothing refs - 1.
message Release {
  repeated int64 chunk_ids = 1;
}

message Extent {
  int64 chunk = 1;
  int64 offset = 2;
  int64 len = 3;
}

// live with refs = 0 → reclaiming (or confirm an already reclaiming chunk).
message BeginReclaim {
  int64 chunk_id = 1;
}

// Remove a reclaiming chunk's metadata after its backend parts are deleted.
message DropChunk {
  int64 chunk_id = 1;
}

// Replace one instance's replica of a chunk (repair / backfill).
message AddReplica {
  int64 chunk_id = 1;
  Replica replica = 2;
}
