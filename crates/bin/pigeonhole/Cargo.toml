[package]
name = "pigeonhole"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[[bin]]
name = "pigeonhole"
path = "src/main.rs"

[dependencies]
pigeonhole-admin = { workspace = true }
pigeonhole-node = { workspace = true }
pigeonhole-raft-telegram = { workspace = true }
pigeonhole-fake-channels = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
s3s = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pigeonhole-blob = { workspace = true }
pigeonhole-limits = { workspace = true }
pigeonhole-types = { workspace = true }
pigeonhole-chunk-store = { workspace = true }
pigeonhole-meta = { workspace = true }
openraft-chat = { workspace = true }
openraft-grpc = { workspace = true, features = ["transport"] }
pigeonhole-gateway-s3 = { workspace = true }
pigeonhole-storage-telegram = { workspace = true }
pigeonhole-telegram-mtproto = { workspace = true }
pigeonhole-config = { workspace = true }
uuid = { workspace = true }
pigeonhole-storage-memory = { workspace = true }
pigeonhole-storage-discord = { workspace = true, optional = true }
pigeonhole-discord-http = { workspace = true, optional = true }
pigeonhole-gateway-bytestream = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
dotenvy = { workspace = true }
tower-http = { workspace = true }
http-body = { workspace = true }
pin-project-lite = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }

[features]
default = ["discord", "metrics-prometheus"]
discord = ["dep:pigeonhole-storage-discord", "dep:pigeonhole-discord-http"]
bytestream = ["dep:pigeonhole-gateway-bytestream"]
metrics-prometheus = ["dep:metrics-exporter-prometheus"]
# Telegram and Discord stores on fake channels (`fake = …` in a store): the
# site's recordings, a node to play with; never in a release build.
fake = ["discord", "dep:pigeonhole-fake-channels", "pigeonhole-config/fake"]

[dev-dependencies]
pigeonhole-storage-telegram = { workspace = true, features = ["fake"] }
metrics = { workspace = true }
metrics-util = { workspace = true }
pigeonhole-testkit = { workspace = true, features = ["s3"] }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
pigeonhole-blob = { workspace = true }
pigeonhole-limits = { workspace = true }
pigeonhole-chunk-store = { workspace = true }
pigeonhole-codec = { workspace = true }
pigeonhole-gateway-s3 = { workspace = true }
hex = { workspace = true }
md-5 = { workspace = true }
s3s = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
dotenvy = { workspace = true }

[lib]
name = "pigeonhole"
path = "src/lib.rs"

[lints]
workspace = true
