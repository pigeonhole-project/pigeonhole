[workspace]
resolver = "2"
members = [
    "crates/core/pigeonhole-types",
    "crates/core/pigeonhole-codec",
    "crates/core/pigeonhole-storage-api",
    "crates/core/pigeonhole-limits",
    "crates/meta/pigeonhole-meta",
    "crates/net/openraft-chat",
    "crates/blob/pigeonhole-blob",
    "crates/blob/pigeonhole-chunk-store",
    "crates/storage/pigeonhole-storage-telegram",
    "crates/storage/pigeonhole-storage-discord",
    "crates/storage/pigeonhole-storage-memory",
    "crates/storage/pigeonhole-storage-disk",
    "crates/gateway/pigeonhole-gateway-s3",
    "crates/gateway/pigeonhole-gateway-bytestream",
    "crates/bin/pigeonhole",
    "crates/testing/pigeonhole-testkit",
    "crates/testing/pigeonhole-sim",
]
default-members = ["crates/bin/pigeonhole"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pluggable blob storage with protocol gateways (S3, ByteStream, …)"

[workspace.dependencies]
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
anyhow = "1"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
bytesize = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
dotenvy = "0.15"
flate2 = "1"
futures = "0.3"
hex = "0.4"
moka = { version = "0.12", features = ["future"] }
metrics = "0.24"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
http = "1"
humantime-serde = "1"
lru = "0.12"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
s3s = "=0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
sha2 = "0.10"
hmac = "0.12"
tempfile = "3"
tokio = { version = "0.2", package = "madsim-tokio", features = ["full"] }
tokio-stream = "0.1"
toml = { version = "0.8", features = ["parse"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["timeout"] }
http-body = "1"
pin-project-lite = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
tonic = { version = "0.12", features = ["transport"] }
tonic-build = "0.12"
protoc-bin-vendored = "3.1"
# MTProto (Telegram). Pre-1.0: pinned exactly.
grammers-mtsender = "=0.11.0"
grammers-session = { version = "=0.11.0", default-features = false }
grammers-tl-types = "=0.11.0"

pigeonhole-meta = { path = "crates/meta/pigeonhole-meta" }
openraft-chat = { path = "crates/net/openraft-chat" }
pigeonhole-types = { path = "crates/core/pigeonhole-types" }
pigeonhole-storage-api = { path = "crates/core/pigeonhole-storage-api" }
pigeonhole-limits = { path = "crates/core/pigeonhole-limits" }
pigeonhole-codec = { path = "crates/core/pigeonhole-codec" }
pigeonhole-blob = { path = "crates/blob/pigeonhole-blob" }
pigeonhole-chunk-store = { path = "crates/blob/pigeonhole-chunk-store" }
pigeonhole-storage-telegram = { path = "crates/storage/pigeonhole-storage-telegram" }
pigeonhole-storage-discord = { path = "crates/storage/pigeonhole-storage-discord" }
pigeonhole-storage-memory = { path = "crates/storage/pigeonhole-storage-memory" }
pigeonhole-storage-disk = { path = "crates/storage/pigeonhole-storage-disk" }
pigeonhole-gateway-s3 = { path = "crates/gateway/pigeonhole-gateway-s3" }
pigeonhole-gateway-bytestream = { path = "crates/gateway/pigeonhole-gateway-bytestream" }
pigeonhole-testkit = { path = "crates/testing/pigeonhole-testkit" }

# A request nobody awaits any more is not sent (vendor/grammers-mtsender/VENDORED.md).
[patch.crates-io]
grammers-mtsender = { path = "vendor/grammers-mtsender" }

# `--cfg madsim` builds the simulation (docs/simulation.md).
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(madsim)"] }
# The two syscalls that need it (hole punching) allow it where they are.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

# CI runs clippy with -D warnings: every lint here is an error there.
# Picked from `pedantic` / `restriction` for catching bugs and needless
# copies, not for style; left out on purpose (too many hits for what they
# find): unwrap_used, expect_used, cast_possible_truncation, doc_markdown,
# missing_panics_doc, significant_drop_tightening, needless_pass_by_value
# (it flags every function handed to map_err).
[workspace.lints.clippy]
# Debugging leftovers.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Bugs and waste.
await_holding_lock = "warn"
large_futures = "warn"
large_types_passed_by_value = "warn"
mem_forget = "warn"
needless_collect = "warn"
or_fun_call = "warn"
rc_buffer = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
trivially_copy_pass_by_ref = "warn"
ref_option = "warn"
undocumented_unsafe_blocks = "warn"
# Plainer code.
explicit_iter_loop = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
used_underscore_binding = "warn"
useless_let_if_seq = "warn"
