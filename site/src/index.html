<!doctype html>
<html lang="{{@lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{meta_desc}}">
<link rel="stylesheet" href="{{@root}}assets/chat.css">
<link rel="stylesheet" href="{{@root}}assets/log.css">
<link rel="stylesheet" href="{{@root}}assets/site.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐦</text></svg>">
</head>
<body>
<nav class="top">
  <a class="brand" href="{{@root}}{{nav.home_href}}"><span class="bird">🐦</span> pigeonhole</a>
  <div class="links">
    <a href="{{@root}}{{nav.try_href}}"><b>{{nav.try}}</b></a>
    <a href="https://github.com/pigeonhole-project/pigeonhole">GitHub</a>
    <a class="lang" href="{{nav.lang_href}}" hreflang="{{nav.lang_code}}">{{nav.lang}}</a>
    <button class="theme" id="theme" type="button" aria-label="{{nav.theme}}">◐</button>
  </div>
</nav>

<header class="hero">
  <p class="kicker">{{hero.kicker}}</p>
  <h1>{{hero.title}}</h1>
  <p class="lede">{{hero.lede}}</p>
  <div class="ctas">
    <a class="btn primary" href="#stage">{{hero.cta_demo}}</a>
    <a class="btn" href="{{@root}}{{nav.try_href}}">{{nav.try}} →</a>
    <a class="btn" href="https://github.com/pigeonhole-project/pigeonhole">{{hero.cta_code}}</a>
  </div>
</header>

<section class="stage-wrap" id="stage">
  <div class="stage" id="replay">
    <div class="pane term">
      <div class="pane-h"><span class="dots"><i></i><i></i><i></i></span>{{replay.terminal}}</div>
      <div class="term-body" data-role="term"></div>
    </div>
    <div class="pane lane lane-tg" data-role="telegram"></div>
    <div class="pane lane lane-dc" data-role="discord"></div>
    <div class="pane log-pane">
      <div class="pane-h">{{replay.log}} <small>{{replay.log_sub}}</small><span class="log-tabs" data-role="log-tabs"></span></div>
      <div class="log-body" data-role="log"></div>
      <ul class="entries log-open" data-role="entry" hidden></ul>
      <div class="lane log-lane" data-role="log-channel" hidden></div>
    </div>
    <div class="narration" data-role="say" aria-live="polite"></div>
    <div class="controls">
      <button type="button" data-act="play">{{replay.pause}}</button>
      <button type="button" data-act="restart">↺ {{replay.restart}}</button>
      <button type="button" data-act="speed">1×</button>
      <span class="meta" data-role="meta"></span>
    </div>
  </div>
  <p class="stage-note">{{replay.note}}</p>
</section>

<footer>
  <p class="warn">⚠️ {{foot.warn}}</p>
  <p>{{foot.license}}</p>
</footer>

<script>
window.I18N = {{@js}};
window.LANG = "{{@lang}}";
window.TRACE = {{@trace:hero}};
</script>
<script type="module" src="{{@root}}assets/site.js"></script>
<script type="module" src="{{@root}}assets/replay.js"></script>
</body>
</html>
