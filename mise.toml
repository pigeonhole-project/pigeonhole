# The tools this repository's tasks call, at fixed versions: `mise install`
# installs them all (https://mise.jdx.dev). Rust itself comes from rustup
# (stable, as on CI); the tasks themselves stay in the Makefile.
#
# A new clone: `mise install`, then `mise run bootstrap` once.

[tools]
# Parallel sessions: a warm build fork per worktree, and turns for the heavy
# commands (scripts/wt, ferry.toml, the Makefile's HEAVY).
"github:patwrall/ferry" = "0.1.3"
"github:mokevnin/heavy" = "0.1.2"
# `make test`
# Its release tags carry the crate's name; a plain string keeps the file one
# mise reads without `mise trust`.
"github:nextest-rs/nextest" = "cargo-nextest-0.9.151"
# `make gates`; easement at CI's version.
"github:mokevnin/easement" = "0.6.0"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:crate-ci/typos" = "1.52.0"
# `make lint-js`, `make test-js`, the site; the compat suites' scripts.
node = "24"
python = "3.12"

[tasks.bootstrap]
description = "Build the warm base new worktrees fork from (once per clone; then `ferry base --rev main --watch --gc` keeps it on main)"
run = "ferry base"
