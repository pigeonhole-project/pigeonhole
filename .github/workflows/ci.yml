name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  AWS_ACCESS_KEY_ID: pigeonhole
  AWS_SECRET_ACCESS_KEY: pigeonholesecret
  AWS_DEFAULT_REGION: us-east-1

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace dependency layers
        run: ./scripts/check-deps.sh --strict
      - run: cargo test --workspace

  simulation:
    name: simulation (madsim)
    # madsim makes entropy deterministic on macOS (symbol overrides); on Linux
    # the getrandom syscall is not intercepted (docs/simulation.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Simulation scenarios, 50 seeds, determinism checked
        run: make sim
        env:
          MADSIM_TEST_NUM: "50"
          MADSIM_TEST_CHECK_DETERMINISM: "1"
      - name: Every library's tests under the simulator, 3 seeds each
        run: make sim-all
        env:
          MADSIM_TEST_NUM: "3"
          MADSIM_TEST_CHECK_DETERMINISM: "1"

  code-report:
    name: code report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install rust-code-analysis-cli
        run: cargo install --locked rust-code-analysis-cli
      - name: Size, complexity, trait graph
        run: ./scripts/code_report.py --out code-report.md
      - run: cat code-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: code-report
          path: code-report.md
      # A ratchet: lower these as the hotspots are split, never raise them.
      - name: No function past the complexity and length limits
        run: ./scripts/code_report.py --no-traits --max-cognitive 20 --max-lines 100 --out /dev/null

  compat-memory:
    name: compat-memory (ceph known-good)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: pip install tox
      - name: Run curated s3-tests (MemoryBlobStore)
        run: ./scripts/compat-memory.sh

  compat-s3s-boto3:
    name: compat-s3s-boto3
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run s3s upstream boto3 suite (MemoryBlobStore)
        run: ./scripts/compat-s3s-boto3.sh

  compat-s3s-e2e:
    name: compat-s3s-e2e
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run s3s-e2e suite (MemoryBlobStore)
        run: ./scripts/compat-s3s-e2e.sh

  compat-rclone:
    name: compat-rclone
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Run s3s rclone e2e (MemoryBlobStore)
        run: ./scripts/compat-rclone.sh
